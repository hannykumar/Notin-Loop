apiVersion: v1
kind: Namespace
metadata:
  name: sre-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: sre-lab
  labels: {app: demo-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: demo-api}
  template:
    metadata:
      labels: {app: demo-api, service: demo-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: self-healing-sre:lab
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "lab.demo_service:app", "--host", "0.0.0.0", "--port", "8088"]
          env:
            - {name: PAYMENTS_URL, value: "http://payments:8088/status"}
          ports: [{name: http, containerPort: 8088}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe: {httpGet: {path: /status, port: http}, initialDelaySeconds: 3, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: sre-lab
  labels: {app: demo-api}
spec:
  selector: {app: demo-api}
  ports: [{name: http, port: 8088, targetPort: http, nodePort: 30080}]
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: sre-lab
  labels: {app: payments}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments, service: payments}
    spec:
      containers:
        - name: payments
          image: self-healing-sre:lab
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "lab.demo_service:app", "--host", "0.0.0.0", "--port", "8088"]
          ports: [{name: http, containerPort: 8088}]
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: sre-lab
spec:
  selector: {app: payments}
  ports: [{name: http, port: 8088, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: traffic-generator}
  template:
    metadata:
      labels: {app: traffic-generator}
    spec:
      containers:
        - name: traffic
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://demo-api:8088/ || true; sleep 1; done"]
